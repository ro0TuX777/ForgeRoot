[embedding_model]
name = "nomic-embed-text:latest"
provider = "ollama"
cache_dir = "models/embeddings"
ollama_model = "nomic-embed-text:latest"
ollama_provider = "ollama"
embedding_dimension = 768

[llm_model]
provider = "ollama"
api_url = "http://127.0.0.1:11434"
default_model = "hf.co/unsloth/DeepSeek-R1-Distill-Qwen-32B-GGUF:Q4_K_M"
fallback_models = ["hf.co/unsloth/DeepSeek-R1-Distill-Qwen-32B-GGUF:Q4_K_M", "hf.co/unsloth/DeepSeek-R1-0528-Qwen3-8B-GGUF:Q4_K_M", "qwen3-coder:30b", "qwen2.5:7b", "llama3.2:3b", "phi3:mini"]
smart_selection = false
code_model = "qwen3-coder:30b"
reasoning_model = "llama3.2:3b"
general_model = "llama3.2:3b"
vision_model = "glm-ocr:latest"

[model_settings]
max_context_length = 4096
temperature = 0.7
max_tokens = 800
timeout_seconds = 180
