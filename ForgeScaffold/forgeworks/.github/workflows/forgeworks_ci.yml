name: forgeworks_ci

on:
  push:
  pull_request:

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Tests
        run: pytest -q

      - name: Validate packs
        run: |
          forgeworks validate --workcell ./packs/ci_change_control/0.1.0
          forgeworks validate --workcell ./packs/it_ops_runbook/0.1.0

      - name: End-to-end representative flow
        run: |
          forgeworks run --workcell ./packs/ci_change_control/0.1.0 --mode supervised --out ./results/ci_supervised
          forgeworks score --results ./results/ci_supervised --oracle ./packs/ci_change_control/0.1.0/oracle/expectations.jsonl --scoring ./packs/ci_change_control/0.1.0/scoring/scoring.json
          forgeworks report --results ./results/ci_supervised --score ./results/ci_supervised/score.json --out ./results/ci_supervised/report.md
          forgeworks summary --results-root ./results --out ./results/summary.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgeworks-results
          path: |
            results/ci_supervised/decision_ledger.jsonl
            results/ci_supervised/approval_records.jsonl
            results/ci_supervised/run_summary.json
            results/ci_supervised/score.json
            results/ci_supervised/report.md
            results/summary.md
