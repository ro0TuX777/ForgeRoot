[project]
name = "forgeworks"
version = "0.1.0"
description = "ForgeWorks Phase A scaffold"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "ForgeScaffold"}]
dependencies = [
  "jsonschema>=4.21.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
forgeworks = "forgeworks.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["forgeworks*"]
exclude = ["packs", "tests", "docs"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
