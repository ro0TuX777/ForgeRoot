[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "forgegate"
version = "0.1.0"
description = "Deterministic action-governance gate for multi-agent systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
forgegate = "forgegate.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["forgegate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

